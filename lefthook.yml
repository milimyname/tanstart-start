pre-commit:
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bunx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    biome-check:
      run: bunx biome check --no-errors-on-unmatched --files-ignore-unknown=true {push_files}
    type-check:
      run: bunx tsc --noEmit
